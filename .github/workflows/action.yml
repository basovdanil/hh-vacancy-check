name: action

on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run the composite action on a live vacancy
        id: check
        uses: ./
        continue-on-error: true
        with:
          vacancies: "139441388"
      - name: The action must return a table
        run: |
          test -n "${{ steps.check.outputs.result }}"
          echo "${{ steps.check.outputs.result }}"

  # Consumer's view: resolve the action through the moving v1 tag, as a real project would.
  remote-tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Run basovdanil/hh-vacancy-check@v1
        id: remote
        uses: basovdanil/hh-vacancy-check@v1
        continue-on-error: true
        with:
          vacancies: "139386982"
          json: "true"
      - name: JSON output must mention the vacancy
        run: |
          echo '${{ steps.remote.outputs.result }}' | tee out.json
          grep -q '139386982' out.json
